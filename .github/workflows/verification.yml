name: verification

on:
  push:
  pull_request:

jobs:
  light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ latexmk make python3 texlive-latex-extra texlive-fonts-recommended
      - name: Build paper
        run: make paper
      - name: Verify checksums
        run: sha256sum -c SHA256SUMS --quiet
      - name: Run light verification
        run: make verify-light
      - name: Verify archived upper rows
        run: make verify-upper

  flint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libflint-dev libgmp-dev make python3 python3-dev python3-pip
      - name: Install pinned Python dependencies
        run: python3 -m pip install --break-system-packages -r requirements-optional.txt
      - name: Run FLINT-dependent unit checks
        run: make verify-unit
